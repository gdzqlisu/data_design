server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/data_design?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379

auth:
  refresh-ttl: 7d
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-0123456789-0123456789-abcdef}
    access-ttl: 15m
    issuer: data-design

management:
  endpoints:
    web:
      exposure:
        include: health,info
