services:
  mysql:
    image: mysql:8.0
    container_name: data-design-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: data_design
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: data-design-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 生产/联调形态：Nginx 同时托管前端静态产物并反代 /api。
  # 首次使用前执行一次 docker pull nginx:1.27-alpine。
  # 注意：这种形态下浏览器 origin 是 http://localhost，
  # 必须同步把 auth-service 的 CONSOLE_BASE_URL 设成 http://localhost，
  # 否则刷新接口会因 Origin 不一致返回 403 cross_origin。
  nginx:
    image: nginx:1.27-alpine
    container_name: data-design-nginx
    profiles: ["edge"]
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../console-web/dist:/usr/share/nginx/html:ro

volumes:
  mysql-data:
